name: campus_os
description: "AI-First Campus Ecosystem for Students"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  riverpod_annotation: ^2.3.5

  # Backend & AI
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_generative_ai: ^0.4.4

  # Design & UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Utilities (Feature Specific)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  image_picker: ^1.1.2
  record: ^5.1.2
  just_audio: ^0.9.40
  speech_to_text: ^7.0.0
  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  firebase_messaging: ^15.2.10
  google_sign_in: ^7.2.0
  file_picker: ^10.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
dependency_overrides:
  record_platform_interface: ^1.5.0
