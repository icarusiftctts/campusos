name: campus_os
description: "AI-First Campus Ecosystem for Students"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State & Navigation
  flutter_riverpod: ^3.3.1
  go_router: ^14.2.0
  riverpod_annotation: ^4.0.2

  # Backend & AI
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_generative_ai: ^0.4.4

  # Design & UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lucide_icons: 0.257.0

  # Utilities (Feature Specific)
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  intl: ^0.19.0
  url_launcher: ^6.3.0
  build_runner: ^2.15.0
  firebase_messaging: ^15.2.10
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/